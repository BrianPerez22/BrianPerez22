<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="432.88" height="392.93" viewBox="0 0 432.88 392.93">
  <title>chispa-triangulo-amarillo-feliz.svg</title>
  <defs>
    <!-- Filtro de Resplandor Neón para Chispa -->
    <filter id="chispaNeon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Filtro Difuminado Suave de Resplandor Trasero para Chispa -->
    <filter id="chispaBackdropBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28" result="softBlur"/>
    </filter>

    <!-- Gradientes Radiales para el Fondo Difuminado de Chispa -->
    <radialGradient id="chispaBackdropGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAFF00" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FFE600" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#E2FF04" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FAFF00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chispaCenterGrad" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#FAFF00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FAFF00" stop-opacity="0"/>
    </radialGradient>

    <!-- Destello Estelar Neón -->
    <g id="sparkleStar">
      <path d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14 Z" fill="#FAFF00" filter="url(#chispaNeon)"/>
    </g>

    <!-- Mini Margarita para Chispa -->
    <g id="miniDaisyChispa">
      <g fill="#FFFFFF" stroke="#121200" stroke-width="1.2">
        <ellipse cx="0" cy="-8" rx="3" ry="5.5"/>
        <ellipse cx="0" cy="8" rx="3" ry="5.5"/>
        <ellipse cx="-8" cy="0" rx="5.5" ry="3"/>
        <ellipse cx="8" cy="0" rx="5.5" ry="3"/>
        <ellipse cx="-6" cy="-6" rx="3" ry="5.5" transform="rotate(-45 -6 -6)"/>
        <ellipse cx="6" cy="6" rx="3" ry="5.5" transform="rotate(-45 6 6)"/>
        <ellipse cx="6" cy="-6" rx="3" ry="5.5" transform="rotate(45 6 -6)"/>
        <ellipse cx="-6" cy="6" rx="3" ry="5.5" transform="rotate(45 -6 6)"/>
      </g>
      <circle cx="0" cy="0" r="5" fill="#FAFF00" stroke="#121200" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- ============================================================== -->
  <!-- FONDO DIFUMINADO TRASERO (Aura Neón difuminada de alto contraste)-->
  <!-- Resalta el contorno oscuro (#121200) contra fondos negros u oscuros -->
  <!-- ============================================================== -->
  <g id="chispaBlurredBackdrop" pointer-events="none">
    <animate attributeName="opacity" values="0.78; 0.96; 0.78" dur="3.2s" repeatCount="indefinite"/>

    <!-- Gran halo difuminado exterior -->
    <ellipse cx="216" cy="196" rx="155" ry="145" fill="url(#chispaBackdropGrad)" filter="url(#chispaBackdropBlur)"/>

    <!-- Silueta difuminada que sigue el contorno triangular de Chispa -->
    <path d="M153.63 91.73 C170.72 81.84 188.7 86.65 204.28 100.44 L333.74 192.81 C358.31 209 354.4 241.68 328.77 256.5 L209.15 325.7 C183.52 340.53 153.25 327.63 151.46 298.25 L135.93 139.98 C131.74 119.6 136.54 101.61 153.63 91.73 Z"
      fill="#FAFF00" opacity="0.75" filter="url(#chispaBackdropBlur)"
      transform="translate(216, 196) scale(1.18) translate(-216, -196)"/>

    <!-- Núcleo central luminoso -->
    <ellipse cx="216" cy="196" rx="95" ry="85" fill="url(#chispaCenterGrad)" filter="url(#chispaBackdropBlur)"/>
  </g>

  <!-- ============================================================== -->
  <!-- ANILLO ORBITAL DE ENERGÍA NEÓN (Giro suave y pulso de brillo)   -->
  <!-- ============================================================== -->
  <g id="orbitRing">
    <animateTransform attributeName="transform" type="rotate"
      values="0 216 196; 360 216 196"
      dur="16s" repeatCount="indefinite"/>
    <path d="M331.323 73.433 C358.21 97.889 328.461 174.383 264.876 244.286 C201.291 314.189 127.949 351.031 101.063 326.575 C74.176 302.118 103.925 225.624 167.51 155.721 C231.095 85.818 304.437 48.976 331.323 73.433 Z"
      fill="none" stroke="#E2FF04" stroke-width="19" opacity="0.9" filter="url(#chispaNeon)">
      <animate attributeName="opacity" values="0.55; 1; 0.55" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ============================================================== -->
  <!-- CUERPO PRINCIPAL DE CHISPA (Levitación flotante y bamboleo)    -->
  <!-- ============================================================== -->
  <g id="chispaFloating">
    <!-- Levitación vertical suave -->
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-14; 0,0"
      dur="2.6s" repeatCount="indefinite"/>

    <!-- Bamboleo juguetón -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 216 196; 2.5 216 196; 0 216 196; -2.5 216 196; 0 216 196"
        dur="5.2s" repeatCount="indefinite"/>

      <!-- Cuerpo Triangular Chispa Amarillo Neón -->
      <path d="M153.63 91.73 C170.72 81.84 188.7 86.65 204.28 100.44 L333.74 192.81 C358.31 209 354.4 241.68 328.77 256.5 L209.15 325.7 C183.52 340.53 153.25 327.63 151.46 298.25 L135.93 139.98 C131.74 119.6 136.54 101.61 153.63 91.73 Z"
        fill="#FAFF00" stroke="#121200" stroke-width="19" filter="url(#chispaNeon)"/>

      <!-- Patas / Rayos Inferiores -->
      <path d="M225.11 308.55 L218.56 350.17 M310.84 259.63 L350.01 275.16"
        fill="none" stroke="#121200" stroke-width="19" stroke-linecap="round"/>

      <!-- Rostro Sonriente Feliz de Chispa -->
      <path d="M227.1 207.12 C220.75 195.99 222.96 182.76 232.04 177.58 C241.12 172.4 253.64 177.22 259.99 188.35"
        fill="none" stroke="#121200" stroke-width="19" stroke-linecap="round" stroke-miterlimit="10"/>

      <!-- Brazos / Rayos Superiores y Laterales -->
      <path d="M140.24 227.63 L86.11 219.5 M280.22 147.75 L300.75 97.01"
        fill="none" stroke="#121200" stroke-width="19" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- DESTELLOS Y DETALLES MÁGICOS ALREDEDOR DE CHISPA               -->
  <!-- ============================================================== -->

  <!-- Destello 1 (Arriba Izquierda) -->
  <g transform="translate(85, 105)">
    <animateTransform attributeName="transform" type="scale"
      values="0.4; 1.3; 0.4" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3; 1; 0.3" dur="1.8s" repeatCount="indefinite"/>
    <use href="#sparkleStar"/>
  </g>

  <!-- Destello 2 (Abajo Derecha) -->
  <g transform="translate(365, 295)">
    <animateTransform attributeName="transform" type="scale"
      values="1.2; 0.3; 1.2" dur="2.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1; 0.2; 1" dur="2.1s" repeatCount="indefinite"/>
    <use href="#sparkleStar"/>
  </g>

  <!-- Mini Margarita Flotante (Arriba Derecha) -->
  <g transform="translate(355, 65)">
    <animateTransform attributeName="transform" type="translate"
      values="355,65; 355,55; 355,65" dur="3s" repeatCount="indefinite"/>
    <use href="#miniDaisyChispa"/>
  </g>
</svg>
