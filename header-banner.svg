<svg viewBox="0 0 850 220" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="neonBannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFF00"/>
      <stop offset="45%" stop-color="#FFE600"/>
      <stop offset="85%" stop-color="#EAFF00"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>

    <radialGradient id="sunburst" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FAFF00" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FAFF00" flood-opacity="0.4"/>
    </filter>

    <!-- Margarita Pattern Symbol -->
    <g id="bgDaisy">
      <g fill="#FFFFFF" opacity="0.85">
        <ellipse cx="0" cy="-14" rx="5" ry="9"/>
        <ellipse cx="0" cy="14" rx="5" ry="9"/>
        <ellipse cx="-14" cy="0" rx="9" ry="5"/>
        <ellipse cx="14" cy="0" rx="9" ry="5"/>
        <ellipse cx="-10" cy="-10" rx="5" ry="9" transform="rotate(-45 -10 -10)"/>
        <ellipse cx="10" cy="10" rx="5" ry="9" transform="rotate(-45 10 10)"/>
        <ellipse cx="10" cy="-10" rx="5" ry="9" transform="rotate(45 10 -10)"/>
        <ellipse cx="-10" cy="10" rx="5" ry="9" transform="rotate(45 -10 10)"/>
      </g>
      <circle cx="0" cy="0" r="9" fill="#0D0D00"/>
      <circle cx="0" cy="0" r="7.5" fill="#FAFF00"/>
      <circle cx="-2.5" cy="-1.5" r="1.3" fill="#0D0D00"/>
      <circle cx="2.5" cy="-1.5" r="1.3" fill="#0D0D00"/>
      <path d="M-2.5 2.5 Q0 4.5 2.5 2.5" stroke="#0D0D00" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Banner Base with Waving Curve -->
  <path d="M0 0 L850 0 L850 170 Q740 215 630 180 T420 185 T210 205 T0 175 Z" fill="url(#neonBannerGrad)" filter="url(#neonShadow)"/>
  <path d="M0 0 L850 0 L850 170 Q740 215 630 180 T420 185 T210 205 T0 175 Z" fill="url(#sunburst)"/>

  <!-- Background Margaritas Floating -->
  <g opacity="0.35">
    <use href="#bgDaisy" x="60" y="45" transform="scale(0.8)"/>
    <use href="#bgDaisy" x="180" y="140" transform="scale(0.6) rotate(15)"/>
    <use href="#bgDaisy" x="780" y="55" transform="scale(0.9) rotate(-20)"/>
    <use href="#bgDaisy" x="710" y="145" transform="scale(0.7) rotate(25)"/>
    <use href="#bgDaisy" x="425" y="30" transform="scale(0.5) rotate(10)"/>
    <use href="#bgDaisy" x="900" y="120" transform="scale(0.55)"/>
  </g>

  <!-- Subtle comic action lines in corner -->
  <g stroke="#0D0D00" stroke-width="1.5" opacity="0.12">
    <line x1="0" y1="0" x2="90" y2="50"/>
    <line x1="0" y1="30" x2="110" y2="70"/>
    <line x1="0" y1="70" x2="120" y2="95"/>
    <line x1="850" y1="0" x2="760" y2="50"/>
    <line x1="850" y1="30" x2="740" y2="70"/>
    <line x1="850" y1="70" x2="730" y2="95"/>
  </g>

  <!-- Mascot / Daisy Accent Left & Right -->
  <g transform="translate(65, 95) scale(1.1)">
    <use href="#bgDaisy"/>
  </g>
  <g transform="translate(785, 95) scale(1.1)">
    <use href="#bgDaisy"/>
  </g>

  <!-- Main Title -->
  <text x="425" y="85" text-anchor="middle" fill="#0D0D00" font-size="44" font-weight="900" letter-spacing="-0.5">
    Brian Pérez Herrera
  </text>

  <!-- Subtitle with Daisies -->
  <text x="425" y="125" text-anchor="middle" fill="#1C1C02" font-size="16" font-weight="700" letter-spacing="0.5">
    Software Engineering Student · TypeScript &amp; React Developer · Founder of Elemental W
  </text>

  <!-- Decorative Pills / Tags -->
  <g transform="translate(425, 155)">
    <!-- Tag 1 -->
    <rect x="-170" y="-12" width="105" height="24" rx="12" fill="#0D0D00"/>
    <text x="-117" y="4" text-anchor="middle" fill="#FAFF00" font-size="11" font-weight="800">🌼 2048-Petal</text>

    <!-- Tag 2 -->
    <rect x="-55" y="-12" width="110" height="24" rx="12" fill="#0D0D00"/>
    <text x="0" y="4" text-anchor="middle" fill="#FAFF00" font-size="11" font-weight="800">✨ Elemental W</text>

    <!-- Tag 3 -->
    <rect x="65" y="-12" width="105" height="24" rx="12" fill="#0D0D00"/>
    <text x="117" y="4" text-anchor="middle" fill="#FAFF00" font-size="11" font-weight="800">⚡ TypeScript</text>
  </g>
</svg>
