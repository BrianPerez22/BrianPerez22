<svg viewBox="0 0 740 315" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Courier New',monospace">
  <defs>
    <filter id="neonSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <g id="termDaisy">
      <g fill="#FFFFFF" opacity="0.6">
        <ellipse cx="0" cy="-7" rx="2.5" ry="4.5"/>
        <ellipse cx="0" cy="7" rx="2.5" ry="4.5"/>
        <ellipse cx="-7" cy="0" rx="4.5" ry="2.5"/>
        <ellipse cx="7" cy="0" rx="4.5" ry="2.5"/>
        <ellipse cx="-5" cy="-5" rx="2.5" ry="4.5" transform="rotate(-45 -5 -5)"/>
        <ellipse cx="5" cy="5" rx="2.5" ry="4.5" transform="rotate(-45 5 5)"/>
        <ellipse cx="5" cy="-5" rx="2.5" ry="4.5" transform="rotate(45 5 -5)"/>
        <ellipse cx="-5" cy="5" rx="2.5" ry="4.5" transform="rotate(45 -5 5)"/>
      </g>
      <circle cx="0" cy="0" r="4.5" fill="#FAFF00"/>
    </g>
  </defs>

  <!-- Clean borderless container -->
  <rect x="0" y="0" width="740" height="315" rx="14" fill="#0A0A03"/>

  <!-- Background Margaritas Subtle Watermark -->
  <g opacity="0.12">
    <use href="#termDaisy" x="650" y="70" transform="scale(1.4)"/>
    <use href="#termDaisy" x="690" y="190" transform="scale(1.1)"/>
    <use href="#termDaisy" x="620" y="270" transform="scale(1.6)"/>
    <use href="#termDaisy" x="480" y="55" transform="scale(0.9)"/>
  </g>

  <!-- Top bar minimal dots -->
  <circle cx="28" cy="24" r="5.5" fill="#FF5F56"/>
  <circle cx="48" cy="24" r="5.5" fill="#FAFF00"/>
  <circle cx="68" cy="24" r="5.5" fill="#27C93F"/>
  <text x="370" y="28" text-anchor="middle" fill="#808060" font-size="12">brian@ean: ~ 🌼</text>

  <!-- Scanlines subtle -->
  <g opacity="0.03">
    <rect x="0" y="45" width="740" height="2" fill="#FAFF00"/>
    <rect x="0" y="75" width="740" height="2" fill="#FAFF00"/>
    <rect x="0" y="105" width="740" height="2" fill="#FAFF00"/>
    <rect x="0" y="135" width="740" height="2" fill="#FAFF00"/>
    <rect x="0" y="165" width="740" height="2" fill="#FAFF00"/>
    <rect x="0" y="195" width="740" height="2" fill="#FAFF00"/>
    <rect x="0" y="225" width="740" height="2" fill="#FAFF00"/>
    <rect x="0" y="255" width="740" height="2" fill="#FAFF00"/>
    <rect x="0" y="285" width="740" height="2" fill="#FAFF00"/>
  </g>

  <!-- Data Display -->
  <g font-size="15">
    <!-- whoami -->
    <text x="35" y="72" fill="#FAFF00" font-weight="900" filter="url(#neonSoft)">$ whoami</text>
    <text x="160" y="72" fill="#FFFFFF" font-weight="500">Brian Pérez Herrera</text>

    <!-- role -->
    <text x="35" y="112" fill="#FAFF00" font-weight="900" filter="url(#neonSoft)">$ role</text>
    <text x="160" y="112" fill="#FFFFFF" font-weight="500">Software Engineering Student @ Universidad EAN</text>

    <!-- stack -->
    <text x="35" y="152" fill="#FAFF00" font-weight="900" filter="url(#neonSoft)">$ stack</text>
    <text x="160" y="152" fill="#FAFF00" font-weight="bold">TypeScript · React · Tailwind CSS · Node.js · JavaScript</text>

    <!-- projects -->
    <text x="35" y="192" fill="#FAFF00" font-weight="900" filter="url(#neonSoft)">$ focus</text>
    <text x="160" y="192" fill="#FFFFFF" font-weight="500">Elemental W (Founder) · 2048-Petal (Botanic Game)</text>

    <!-- languages -->
    <text x="35" y="235" fill="#FAFF00" font-weight="900" filter="url(#neonSoft)">$ languages</text>
    <g transform="translate(160, 222)">
      <text x="0" y="12" fill="#A0A080" font-size="13">es</text>
      <rect x="25" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="38" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="51" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="64" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="77" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="90" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="103" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="116" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="129" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="142" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <text x="162" y="12" fill="#FAFF00" font-size="12" font-weight="bold">native</text>

      <text x="240" y="12" fill="#A0A080" font-size="13">en</text>
      <rect x="265" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="278" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="291" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="304" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="317" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="330" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="343" y="1" width="10" height="12" rx="2" fill="#FAFF00"/>
      <rect x="356" y="1" width="10" height="12" rx="2" fill="#2A2A0E"/>
      <rect x="369" y="1" width="10" height="12" rx="2" fill="#2A2A0E"/>
      <rect x="382" y="1" width="10" height="12" rx="2" fill="#2A2A0E"/>
      <text x="402" y="12" fill="#FAFF00" font-size="12" font-weight="bold">professional</text>
    </g>

    <!-- command prompt with animated blinking cursor -->
    <text x="35" y="278" fill="#FAFF00" font-weight="900" filter="url(#neonSoft)">$</text>
    <rect x="52" y="263" width="9" height="17" fill="#FAFF00">
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
